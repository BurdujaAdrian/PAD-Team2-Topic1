# Common deployment for PAD Team 2's services.
# teammate's service is pulled as a prebuilt image from DockerHub.

# Docker forwards container stdout/stderr to the Broker's bounded log archive.
# The local Docker cache remains available through `docker compose logs`.
x-system-logging: &system-logging
    driver: syslog
    options:
        syslog-address: "udp://127.0.0.1:${SYSLOG_HOST_PORT:-15514}"
        syslog-format: rfc5424micro
        tag: "{{.Name}}"

# Every cache node runs the same Redis; only the name differs.
x-cache-node: &cache-node
    logging: *system-logging
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 10

# Every node of a database cluster runs the same image: Postgres with repmgr,
# which streams each write to the standbys and promotes one of them when the
# primary stops answering. The old primary rejoins as a standby when it is back.
x-base-db: &base-db
    logging: *system-logging
    image: bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2
    restart: unless-stopped
    depends_on:
        broker:
            condition: service_healthy
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${BASE_POSTGRES_USER} -d ${BASE_POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 20

x-base-db-env: &base-db-env
    POSTGRESQL_DATABASE: ${BASE_POSTGRES_DB}
    POSTGRESQL_USERNAME: ${BASE_POSTGRES_USER}
    POSTGRESQL_PASSWORD: ${BASE_POSTGRES_PASSWORD}
    POSTGRESQL_POSTGRES_PASSWORD: ${BASE_POSTGRES_ADMIN_PASSWORD}
    REPMGR_PASSWORD: ${BASE_REPMGR_PASSWORD}
    # Only read on the very first start, to pick who initializes the cluster;
    # after a failover the nodes find the current primary themselves.
    REPMGR_PRIMARY_HOST: base-db-1
    REPMGR_PARTNER_NODES: base-db-1,base-db-2,base-db-3
    REPMGR_PORT_NUMBER: 5432

x-crafting-db: &crafting-db
    logging: *system-logging
    image: bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2
    restart: unless-stopped
    depends_on:
        broker:
            condition: service_healthy
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${CRAFTING_POSTGRES_USER} -d ${CRAFTING_POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 20

x-crafting-db-env: &crafting-db-env
    POSTGRESQL_DATABASE: ${CRAFTING_POSTGRES_DB}
    POSTGRESQL_USERNAME: ${CRAFTING_POSTGRES_USER}
    POSTGRESQL_PASSWORD: ${CRAFTING_POSTGRES_PASSWORD}
    POSTGRESQL_POSTGRES_PASSWORD: ${CRAFTING_POSTGRES_ADMIN_PASSWORD}
    REPMGR_PASSWORD: ${CRAFTING_REPMGR_PASSWORD}
    # Only read on the very first start, to pick who initializes the cluster;
    # after a failover the nodes find the current primary themselves.
    REPMGR_PRIMARY_HOST: crafting-db-1
    REPMGR_PARTNER_NODES: crafting-db-1,crafting-db-2,crafting-db-3
    REPMGR_PORT_NUMBER: 5432

x-zombie-cluster: &zombie-cluster
    image: bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2
    platform: linux/amd64
    entrypoint: ["/bin/bash", "/config/postgres-start.sh"]
    logging: *system-logging
    restart: unless-stopped
    healthcheck:
        test: ["CMD-SHELL", "test -f /opt/bitnami/postgresql/tmp/.initialized && pg_isready -h 127.0.0.1 -U ${ZOMBIE_POSTGRES_USER} -d ${ZOMBIE_POSTGRES_DB}"]
        interval: 5s
        timeout: 3s
        retries: 30
        start_period: 90s

x-zombie-cluster-env: &zombie-cluster-env
    POSTGRESQL_DATABASE: ${ZOMBIE_POSTGRES_DB}
    POSTGRESQL_USERNAME: ${ZOMBIE_POSTGRES_USER}
    POSTGRESQL_PASSWORD: ${ZOMBIE_POSTGRES_PASSWORD}
    POSTGRESQL_POSTGRES_PASSWORD: ${ZOMBIE_POSTGRES_ADMIN_PASSWORD}
    REPMGR_PASSWORD: ${ZOMBIE_REPMGR_PASSWORD}
    REPMGR_PRIMARY_HOST: zombie-db-1
    REPMGR_PARTNER_NODES: zombie-db-1,zombie-db-2,zombie-db-3
    REPMGR_NODE_PRIORITY: "100"
    REPMGR_FENCE_OLD_PRIMARY: "yes"
    REPMGR_CHILD_NODES_DISCONNECT_TIMEOUT: "60"
    PGOPTIONS: "-c synchronous_commit=local" # repmgr metadata only; API writes stay synchronous
    REPMGR_CONNECT_TIMEOUT: "2"
    REPMGR_RECONNECT_ATTEMPTS: "3"
    REPMGR_RECONNECT_INTERVAL: "2"
    POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: "1"
    POSTGRESQL_SYNCHRONOUS_REPLICAS_MODE: ANY
    POSTGRESQL_SYNCHRONOUS_COMMIT_MODE: "on"

x-resource-cluster: &resource-cluster
    image: bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2
    platform: linux/amd64
    entrypoint: ["/bin/bash", "/config/postgres-start.sh"]
    logging: *system-logging
    restart: unless-stopped
    healthcheck:
        test: ["CMD-SHELL", "test -f /opt/bitnami/postgresql/tmp/.initialized && pg_isready -h 127.0.0.1 -U ${RESOURCE_POSTGRES_USER} -d ${RESOURCE_POSTGRES_DB}"]
        interval: 5s
        timeout: 3s
        retries: 30
        start_period: 90s

x-resource-cluster-env: &resource-cluster-env
    POSTGRESQL_DATABASE: ${RESOURCE_POSTGRES_DB}
    POSTGRESQL_USERNAME: ${RESOURCE_POSTGRES_USER}
    POSTGRESQL_PASSWORD: ${RESOURCE_POSTGRES_PASSWORD}
    POSTGRESQL_POSTGRES_PASSWORD: ${RESOURCE_POSTGRES_ADMIN_PASSWORD}
    REPMGR_PASSWORD: ${RESOURCE_REPMGR_PASSWORD}
    REPMGR_PRIMARY_HOST: resource-db-1
    REPMGR_PARTNER_NODES: resource-db-1,resource-db-2,resource-db-3
    REPMGR_NODE_PRIORITY: "100"
    REPMGR_FENCE_OLD_PRIMARY: "yes"
    REPMGR_CHILD_NODES_DISCONNECT_TIMEOUT: "60"
    PGOPTIONS: "-c synchronous_commit=local" # repmgr metadata only; API writes stay synchronous
    REPMGR_CONNECT_TIMEOUT: "2"
    REPMGR_RECONNECT_ATTEMPTS: "3"
    REPMGR_RECONNECT_INTERVAL: "2"
    POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: "1"
    POSTGRESQL_SYNCHRONOUS_REPLICAS_MODE: ANY
    POSTGRESQL_SYNCHRONOUS_COMMIT_MODE: "on"

services:
    # ---------------------------------------------------------------------
    # Gateway
    # ---------------------------------------------------------------------
    gateway:
        logging: *system-logging
        image: gheorghe2973/gateway-service:4.1.0-dev
        container_name: cpr-gateway
        restart: unless-stopped
        environment:
            BROKER_URL: http://broker:8080
            TASK_TIMEOUT_SECONDS: 30
            WS_TICKET_SECRET: ${WS_TICKET_SECRET:-}
        depends_on:
            broker:
                condition: service_healthy
        ports:
            - "8000:8080"

    # Message Broker: routing, breakers, durable event queues and system logs.
    broker:
        logging: *system-logging
        image: ${BROKER_IMAGE:-adrianburduja/messege-broker:4.1.1-dev}
        container_name: cpr-broker
        restart: unless-stopped
        environment:
            DISCOVERY_URL: http://discovery:8080
            TASK_TIMEOUT_SECONDS: 5
            MAX_FAILOVER_ATTEMPTS: 3
            SYSLOG_ENABLED: "1"
            LOG_DOWNLOAD_TOKEN: ${LOG_DOWNLOAD_TOKEN:-}
        ports:
            - "127.0.0.1:8600:8080"
            - "127.0.0.1:50050:50050"
            - "127.0.0.1:${SYSLOG_HOST_PORT:-15514}:5514/udp"
        volumes:
            - broker_data:/app/data

    # ---------------------------------------------------------------------
    # Monitoring
    # ---------------------------------------------------------------------
    # Prometheus scrapes the Broker every 5 seconds; Grafana draws it. Their
    # configuration and the dashboard live in the Broker's repository, so the
    # message-broker submodule has to be checked out.
    prometheus:
        logging: *system-logging
        image: prom/prometheus:v3.5.0
        container_name: cpr-prometheus
        restart: unless-stopped
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=7d
        volumes:
            - ./services/message-broker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        depends_on:
            broker:
                condition: service_healthy
        ports:
            - "127.0.0.1:9090:9090"

    grafana:
        logging: *system-logging
        image: grafana/grafana:12.1.0
        container_name: cpr-grafana
        restart: unless-stopped
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
            # The dashboard can be read without logging in; changing anything
            # needs the admin account.
            GF_AUTH_ANONYMOUS_ENABLED: "true"
            GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/message-broker.json
            GF_ANALYTICS_REPORTING_ENABLED: "false"
            GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
            # Grafana logs every page load at info, which would crowd the other
            # services out of the Broker's bounded log archive.
            GF_LOG_LEVEL: warn
        volumes:
            - ./services/message-broker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./services/message-broker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana_data:/var/lib/grafana
        depends_on:
            - prometheus
        ports:
            - "3000:3000"

    # ---------------------------------------------------------------------
    # Discovery Service
    # ---------------------------------------------------------------------
    # The registry instances join on startup. It keeps no data of its own:
    # the registry lives in memory and the instances rebuild it by registering again.
    discovery:
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: ion04/discovery-service:4.0.0
        container_name: cpr-discovery
        restart: unless-stopped
        environment:
            LOG_LEVEL: INFO
            # Health alerts also go to the developers' Telegram group. Left empty in
            # .env, the alerts are only logged.
            TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
            TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
        ports:
            - "8500:8080"

    # ---------------------------------------------------------------------
    # Response cache
    # ---------------------------------------------------------------------
    # Three Redis nodes. Base and Crafting shard their GET answers over them by consistent
    # hashing: every key has one node, the same for every replica, and when a node stops
    # only its keys move to the next one. Each service keeps its keys under its own prefix.
    # Nothing is kept for good: no volume, no persistence, and the least recently used keys
    # go when a node's memory limit is reached. The services do not wait for the nodes
    # (no depends_on): without them they read the database.
    cache-1:
        <<: *cache-node
        container_name: cpr-cache-1

    cache-2:
        <<: *cache-node
        container_name: cpr-cache-2

    cache-3:
        <<: *cache-node
        container_name: cpr-cache-3

    # ---------------------------------------------------------------------
    # Base Service
    # ---------------------------------------------------------------------
    base-db-1:
        <<: *base-db
        container_name: cpr-base-db-1
        environment:
            <<: *base-db-env
            REPMGR_NODE_NAME: base-db-1
            REPMGR_NODE_NETWORK_NAME: base-db-1
        volumes:
            - base_db_1:/bitnami/postgresql
    base-db-2:
        <<: *base-db
        container_name: cpr-base-db-2
        environment:
            <<: *base-db-env
            REPMGR_NODE_NAME: base-db-2
            REPMGR_NODE_NETWORK_NAME: base-db-2
        volumes:
            - base_db_2:/bitnami/postgresql
    base-db-3:
        <<: *base-db
        container_name: cpr-base-db-3
        environment:
            <<: *base-db-env
            REPMGR_NODE_NAME: base-db-3
            REPMGR_NODE_NETWORK_NAME: base-db-3
        volumes:
            - base_db_3:/bitnami/postgresql

    base-api:
        logging: *system-logging
        image: ion04/base-service:5.1.0
        restart: unless-stopped
        # Two instances sharing the base-db cluster. No container_name and no host port:
        # replicas cannot share either, so Base is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            # Npgsql tries the nodes in order and keeps the one that accepts
            # writes, so after a failover Base follows the new primary by itself.
            ConnectionStrings__DefaultConnection: Host=base-db-1,base-db-2,base-db-3;Port=5432;Database=${BASE_POSTGRES_DB};Username=${BASE_POSTGRES_USER};Password=${BASE_POSTGRES_PASSWORD};Target Session Attributes=primary
            # Every call to World and Resource goes through the Broker.
            # Required: the service refuses to start without it.
            BROKER_URL: http://broker:8080
            # kiki-reward-granted is handed to the Broker over gRPC. section-unlocked
            # arrives from it on the gRPC port 50051, which every replica names
            # as a topic in its Discovery registration. Required as well.
            BROKER_GRPC_ADDR: broker:50050
            # Each replica registers here on startup so the Broker can find it.
            DISCOVERY_URL: http://discovery:8080
            # GET /api/bases/{id} is answered from these Redis nodes, sharded by consistent
            # hashing. Optional: without it every read goes to the database.
            REDIS_ADDR: cache-1:6379,cache-2:6379,cache-3:6379
            # Only the cache's logs at Debug: which node every base was read from or stored on.
            Logging__LogLevel__src.Infrastructure.Caching: Debug
        depends_on:
            broker:
                condition: service_healthy
            base-db-1:
                condition: service_healthy
            base-db-2:
                condition: service_healthy
            base-db-3:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # Crafting Service
    # ---------------------------------------------------------------------
    crafting-db-1:
        <<: *crafting-db
        container_name: cpr-crafting-db-1
        environment:
            <<: *crafting-db-env
            REPMGR_NODE_NAME: crafting-db-1
            REPMGR_NODE_NETWORK_NAME: crafting-db-1
        volumes:
            - crafting_db_1:/bitnami/postgresql
    crafting-db-2:
        <<: *crafting-db
        container_name: cpr-crafting-db-2
        environment:
            <<: *crafting-db-env
            REPMGR_NODE_NAME: crafting-db-2
            REPMGR_NODE_NETWORK_NAME: crafting-db-2
        volumes:
            - crafting_db_2:/bitnami/postgresql
    crafting-db-3:
        <<: *crafting-db
        container_name: cpr-crafting-db-3
        environment:
            <<: *crafting-db-env
            REPMGR_NODE_NAME: crafting-db-3
            REPMGR_NODE_NETWORK_NAME: crafting-db-3
        volumes:
            - crafting_db_3:/bitnami/postgresql

    crafting-api:
        logging: *system-logging
        image: ion04/crafting-service:5.2.0
        restart: unless-stopped
        # Two instances sharing the crafting-db cluster. No container_name and no host port:
        # replicas cannot share either, so Crafting is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            POSTGRES_DB: ${CRAFTING_POSTGRES_DB}
            POSTGRES_USER: ${CRAFTING_POSTGRES_USER}
            POSTGRES_PASSWORD: ${CRAFTING_POSTGRES_PASSWORD}
            # Every node of the cluster: Crafting connects to the one that accepts
            # writes, so after a failover it follows the new primary by itself.
            POSTGRES_HOST: crafting-db-1,crafting-db-2,crafting-db-3
            POSTGRES_PORT: 5432
            # Every call to Resource, Player and Exam goes through the Broker.
            # Required: the service refuses to start without it.
            BROKER_URL: http://broker:8080
            # item-crafted is handed to the Broker over gRPC. exam-passed arrives
            # from it on the gRPC port 50051, which every replica names as a topic
            # in its Discovery registration. Required as well.
            BROKER_GRPC_ADDR: broker:50050
            # Each replica registers here on startup so the Broker can find it.
            DISCOVERY_URL: http://discovery:8080
            # GET /api/recipes and GET /api/recipes/{id} are answered from these Redis nodes,
            # sharded by consistent hashing. Optional: without it every read goes to the database.
            REDIS_ADDR: cache-1:6379,cache-2:6379,cache-3:6379
            # Only the cache's logs at Debug: which node every recipe was read from or stored on.
            Logging__LogLevel__src.Infrastructure.Caching: Debug
        depends_on:
            broker:
                condition: service_healthy
            crafting-db-1:
                condition: service_healthy
            crafting-db-2:
                condition: service_healthy
            crafting-db-3:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # Zombie Service
    # ---------------------------------------------------------------------
    # Retained only for a deliberate dump/restore from the old single database.
    zombie-db:
        profiles: [legacy-databases]
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: postgres:17
        container_name: cpr-zombie-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${ZOMBIE_POSTGRES_DB}
            POSTGRES_USER: ${ZOMBIE_POSTGRES_USER}
            POSTGRES_PASSWORD: ${ZOMBIE_POSTGRES_PASSWORD}
        ports:
            - "127.0.0.1:5434:5432"
        volumes:
            - zombie_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${ZOMBIE_POSTGRES_USER} -d ${ZOMBIE_POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5

    zombie-db-1:
        <<: *zombie-cluster
        environment:
            <<: *zombie-cluster-env
            REPMGR_NODE_NAME: zombie-db-1
            REPMGR_NODE_NETWORK_NAME: zombie-db-1
        volumes:
            - zombie_db_1:/bitnami/postgresql
            - ./deploy/postgres-start.sh:/config/postgres-start.sh:ro

    zombie-db-2:
        <<: *zombie-cluster
        environment:
            <<: *zombie-cluster-env
            REPMGR_NODE_NAME: zombie-db-2
            REPMGR_NODE_NETWORK_NAME: zombie-db-2
        volumes:
            - zombie_db_2:/bitnami/postgresql
            - ./deploy/postgres-start.sh:/config/postgres-start.sh:ro

    zombie-db-3:
        <<: *zombie-cluster
        environment:
            <<: *zombie-cluster-env
            REPMGR_NODE_NAME: zombie-db-3
            REPMGR_NODE_NETWORK_NAME: zombie-db-3
        volumes:
            - zombie_db_3:/bitnami/postgresql
            - ./deploy/postgres-start.sh:/config/postgres-start.sh:ro

    zombie-api:
        logging: *system-logging
        image: susanito88/zombie-service:5.0.0
        restart: unless-stopped
        # Two instances sharing the zombie database cluster. No container_name and no host port:
        # replicas cannot share either, so Zombie is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            ConnectionStrings__Database: Host=zombie-db-1,zombie-db-2,zombie-db-3;Target Session Attributes=primary;Host Recheck Seconds=1;Timeout=3;Port=5432;Database=${ZOMBIE_POSTGRES_DB};Username=${ZOMBIE_POSTGRES_USER};Password=${ZOMBIE_POSTGRES_PASSWORD}
            REDIS_ADDR: cache-1:6379,cache-2:6379,cache-3:6379
            Cache__TtlSeconds: "60"
            Database__ApplyMigrationsOnStartup: "true"
            # Each replica registers here on startup so the Broker can find it.
            DISCOVERY_URL: http://discovery:8080
        depends_on:
            broker:
                condition: service_healthy
            zombie-db-1:
                condition: service_healthy
            zombie-db-2:
                condition: service_healthy
            zombie-db-3:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # Resource Service
    # ---------------------------------------------------------------------
    # Retained only for a deliberate dump/restore from the old single database.
    resource-db:
        profiles: [legacy-databases]
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: postgres:17
        container_name: cpr-resource-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${RESOURCE_POSTGRES_DB}
            POSTGRES_USER: ${RESOURCE_POSTGRES_USER}
            POSTGRES_PASSWORD: ${RESOURCE_POSTGRES_PASSWORD}
        ports:
            - "127.0.0.1:5435:5432"
        volumes:
            - resource_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${RESOURCE_POSTGRES_USER} -d ${RESOURCE_POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5

    resource-db-1:
        <<: *resource-cluster
        environment:
            <<: *resource-cluster-env
            REPMGR_NODE_NAME: resource-db-1
            REPMGR_NODE_NETWORK_NAME: resource-db-1
        volumes:
            - resource_db_1:/bitnami/postgresql
            - ./deploy/postgres-start.sh:/config/postgres-start.sh:ro

    resource-db-2:
        <<: *resource-cluster
        environment:
            <<: *resource-cluster-env
            REPMGR_NODE_NAME: resource-db-2
            REPMGR_NODE_NETWORK_NAME: resource-db-2
        volumes:
            - resource_db_2:/bitnami/postgresql
            - ./deploy/postgres-start.sh:/config/postgres-start.sh:ro

    resource-db-3:
        <<: *resource-cluster
        environment:
            <<: *resource-cluster-env
            REPMGR_NODE_NAME: resource-db-3
            REPMGR_NODE_NETWORK_NAME: resource-db-3
        volumes:
            - resource_db_3:/bitnami/postgresql
            - ./deploy/postgres-start.sh:/config/postgres-start.sh:ro

    resource-api:
        logging: *system-logging
        image: susanito88/resource-service:5.1.0
        restart: unless-stopped
        # Two instances sharing the resource database cluster. No container_name and no host port:
        # replicas cannot share either, so Resource is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            ConnectionStrings__Database: Host=resource-db-1,resource-db-2,resource-db-3;Target Session Attributes=primary;Host Recheck Seconds=1;Timeout=3;Port=5432;Database=${RESOURCE_POSTGRES_DB};Username=${RESOURCE_POSTGRES_USER};Password=${RESOURCE_POSTGRES_PASSWORD}
            REDIS_ADDR: cache-1:6379,cache-2:6379,cache-3:6379
            Cache__TtlSeconds: "60"
            Database__ApplyMigrationsOnStartup: "true"
            # Each replica registers here on startup so the Broker can find it.
            DISCOVERY_URL: http://discovery:8080
        depends_on:
            broker:
                condition: service_healthy
            resource-db-1:
                condition: service_healthy
            resource-db-2:
                condition: service_healthy
            resource-db-3:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # Game Service
    # ---------------------------------------------------------------------
    game-db:
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: rqlite/rqlite:10.3.6
        container_name: cpr-game-db
        restart: unless-stopped
        command:
            - -node-id=game
            - -http-addr=0.0.0.0:4001
            - -http-adv-addr=game-db:4001
            - -raft-addr=0.0.0.0:4002
            - -raft-adv-addr=game-db:4002
        volumes:
            - game-data:/rqlite/file
        ports:
            - "127.0.0.1:4004:4001" # HTTP API — only needed on the host for local debugging
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4001/readyz"]
            interval: 3s
            timeout: 2s
            retries: 10
            start_period: 5s

    game-service-1:
        logging: *system-logging
        image: adrianburduja/game-service:4.0.1
        restart: unless-stopped
        depends_on:
            broker:
                condition: service_healthy
            game-db:
                condition: service_healthy
        environment:
            - DB_DSN=http://game-db:4001
            - WS_TICKET_SECRET=${WS_TICKET_SECRET}
            - WS_PUBLIC_ADDRESS=http://localhost:8086
            - INSTANCE_ID=game-service-1
            - DISCOVERY_URL=http://discovery:8080
        ports:
            - "8086:8080"
    game-service-2:
        logging: *system-logging
        image: adrianburduja/game-service:3.2.5
        restart: unless-stopped
        depends_on:
            broker:
                condition: service_healthy
            game-db:
                condition: service_healthy
        environment:
            - DB_DSN=http://game-db:4001
            - WS_TICKET_SECRET=${WS_TICKET_SECRET}
            - WS_PUBLIC_ADDRESS=http://localhost:8087
            - INSTANCE_ID=game-service-2
            - DISCOVERY_URL=http://discovery:8080
        ports:
            - "8087:8080"

    # ---------------------------------------------------------------------
    # Player Service
    # ---------------------------------------------------------------------
    player-db:
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: rqlite/rqlite:10.3.6
        container_name: cpr-player-db
        restart: unless-stopped
        command:
            - -node-id=player
            - -http-addr=0.0.0.0:4001
            - -http-adv-addr=player-db:4001
            - -raft-addr=0.0.0.0:4002
            - -raft-adv-addr=player-db:4002
        volumes:
            - player-data:/rqlite/file
        ports:
            - "127.0.0.1:4002:4001" # HTTP API — only needed on the host for local debugging
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4001/readyz"]
            interval: 3s
            timeout: 2s
            retries: 10
            start_period: 5s

    player-service:
        logging: *system-logging
        image: adrianburduja/player-service:4.0.1
        restart: unless-stopped
        depends_on:
            broker:
                condition: service_healthy
            player-db:
                condition: service_healthy
        deploy:
            replicas: 2
        environment:
            - DISCOVERY_URL=http://discovery:8080
            - DB_DSN=http://player-db:4001

    # ---------------------------------------------------------------------
    # Exam Service
    # ---------------------------------------------------------------------
    exam-db:
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: rqlite/rqlite:10.3.6
        container_name: cpr-exam-rqlite
        restart: unless-stopped
        command:
            - -node-id=exam
            - -http-addr=0.0.0.0:4001
            - -http-adv-addr=exam-db:4001
            - -raft-addr=0.0.0.0:4002
            - -raft-adv-addr=exam-db:4002
        ports:
            - "127.0.0.1:4001:4001"
        volumes:
            - exam_rqlite_data:/rqlite/file
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:4001/readyz"]
            interval: 10s
            timeout: 5s
            retries: 5

    exam-api:
        logging: *system-logging
        image: gheorghe2973/exam-service:4.0.0
        restart: unless-stopped
        # Two instances sharing exam-db. No container_name and no host port:
        # replicas cannot share either, so Exam is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            RQLITE_URL: http://exam-db:4001
            # Both replicas seed at boot; rows that already exist are skipped.
            SEED_ON_START: "true"
            # exam-passed and achievement-unlocked are handed to the Broker over
            # gRPC; it delivers them to whoever subscribed to the topic.
            BROKER_GRPC_ADDR: broker:50050
            DISCOVERY_URL: http://discovery:8080
            REGISTER_INTERVAL_SECONDS: "2"
        depends_on:
            broker:
                condition: service_healthy
            exam-db:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # World Service
    # ---------------------------------------------------------------------
    world-db:
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: rqlite/rqlite:10.3.6
        container_name: cpr-world-rqlite
        restart: unless-stopped
        command:
            - -node-id=world
            - -http-addr=0.0.0.0:4001
            - -http-adv-addr=world-db:4001
            - -raft-addr=0.0.0.0:4002
            - -raft-adv-addr=world-db:4002
        ports:
            - "127.0.0.1:4003:4001"
        volumes:
            - world_rqlite_data:/rqlite/file
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:4001/readyz"]
            interval: 10s
            timeout: 5s
            retries: 5

    world-api:
        logging: *system-logging
        image: gheorghe2973/world-service:4.0.0
        restart: unless-stopped
        # Two instances sharing world-db. No container_name and no host port:
        # replicas cannot share either, so World is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            RQLITE_URL: http://world-db:4001
            # Both replicas seed at boot; rows that already exist are skipped.
            SEED_ON_START: "true"
            # section-unlocked is handed to the Broker over gRPC. exam-passed
            # arrives from it on the gRPC port 50051, which every replica names
            # as a topic in its Discovery registration.
            BROKER_GRPC_ADDR: broker:50050
            DISCOVERY_URL: http://discovery:8080
            REGISTER_INTERVAL_SECONDS: "2"
        depends_on:
            broker:
                condition: service_healthy
            world-db:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # Data Warehouse and ETL
    # ---------------------------------------------------------------------
    # Only etl-service writes here; no game service reads or writes it.
    warehouse-db:
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: postgres:17
        container_name: cpr-warehouse-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB}
            POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER}
            POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD}
        ports:
            - "127.0.0.1:5436:5432"
        volumes:
            - warehouse_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_POSTGRES_USER} -d ${WAREHOUSE_POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    # Copies the data of every service database into warehouse-db every
    # ETL_INTERVAL_SECONDS. Built from this repository, not pulled from Docker Hub.
    # One instance only: a second one would load the same rows at the same time.
    etl-service:
        logging: *system-logging
        build: ./services/etl-service
        container_name: cpr-etl-service
        restart: unless-stopped
        environment:
            ETL_INTERVAL_SECONDS: ${ETL_INTERVAL_SECONDS:-60}
            WAREHOUSE_POSTGRES_HOST: warehouse-db
            WAREHOUSE_POSTGRES_PORT: 5432
            WAREHOUSE_POSTGRES_DB: ${WAREHOUSE_POSTGRES_DB}
            WAREHOUSE_POSTGRES_USER: ${WAREHOUSE_POSTGRES_USER}
            WAREHOUSE_POSTGRES_PASSWORD: ${WAREHOUSE_POSTGRES_PASSWORD}
            # Sources on Postgres.
            BASE_POSTGRES_HOST: base-db-1,base-db-2,base-db-3
            BASE_POSTGRES_PORT: 5432
            BASE_POSTGRES_DB: ${BASE_POSTGRES_DB}
            BASE_POSTGRES_USER: ${BASE_POSTGRES_USER}
            BASE_POSTGRES_PASSWORD: ${BASE_POSTGRES_PASSWORD}
            CRAFTING_POSTGRES_HOST: crafting-db-1,crafting-db-2,crafting-db-3
            CRAFTING_POSTGRES_PORT: 5432
            CRAFTING_POSTGRES_DB: ${CRAFTING_POSTGRES_DB}
            CRAFTING_POSTGRES_USER: ${CRAFTING_POSTGRES_USER}
            CRAFTING_POSTGRES_PASSWORD: ${CRAFTING_POSTGRES_PASSWORD}
            ZOMBIE_POSTGRES_HOST: zombie-db-1,zombie-db-2,zombie-db-3
            ZOMBIE_POSTGRES_PORT: 5432
            ZOMBIE_POSTGRES_DB: ${ZOMBIE_POSTGRES_DB}
            ZOMBIE_POSTGRES_USER: ${ZOMBIE_POSTGRES_USER}
            ZOMBIE_POSTGRES_PASSWORD: ${ZOMBIE_POSTGRES_PASSWORD}
            RESOURCE_POSTGRES_HOST: resource-db-1,resource-db-2,resource-db-3
            RESOURCE_POSTGRES_PORT: 5432
            RESOURCE_POSTGRES_DB: ${RESOURCE_POSTGRES_DB}
            RESOURCE_POSTGRES_USER: ${RESOURCE_POSTGRES_USER}
            RESOURCE_POSTGRES_PASSWORD: ${RESOURCE_POSTGRES_PASSWORD}
            # Sources on rqlite, read through its HTTP API.
            GAME_RQLITE_URL: http://game-db:4001
            PLAYER_RQLITE_URL: http://player-db:4001
            EXAM_RQLITE_URL: http://exam-db:4001
            WORLD_RQLITE_URL: http://world-db:4001
        # Only the warehouse is required. A source database that is down fails
        # its own part of the run; the other sources still load.
        depends_on:
            warehouse-db:
                condition: service_healthy
        ports:
            - "127.0.0.1:8700:8080"

volumes:
    broker_data:
    base_db_1:
    base_db_2:
    base_db_3:
    crafting_db_1:
    crafting_db_2:
    crafting_db_3:
    zombie_pgdata:
    resource_pgdata:
    game-data:
    player-data:
    exam_rqlite_data:
    world_rqlite_data:
    prometheus_data:
    grafana_data:
    warehouse_pgdata:
    zombie_db_1:
    zombie_db_2:
    zombie_db_3:
    resource_db_1:
    resource_db_2:
    resource_db_3:
