# Common deployment for PAD Team 2's services.
# teammate's service is pulled as a prebuilt image from DockerHub.

# Docker forwards container stdout/stderr to the Broker's bounded log archive.
# The local Docker cache remains available through `docker compose logs`.
x-system-logging: &system-logging
    driver: syslog
    options:
        syslog-address: "udp://127.0.0.1:${SYSLOG_HOST_PORT:-15514}"
        syslog-format: rfc5424micro
        tag: "{{.Name}}"

services:
    # ---------------------------------------------------------------------
    # Gateway
    # ---------------------------------------------------------------------
    gateway:
        logging: *system-logging
        image: gheorghe2973/gateway-service:4.1.0-dev
        container_name: cpr-gateway
        restart: unless-stopped
        environment:
            BROKER_URL: http://broker:8080
            TASK_TIMEOUT_SECONDS: 30
            WS_TICKET_SECRET: ${WS_TICKET_SECRET:-}
        depends_on:
            broker:
                condition: service_healthy
        ports:
            - "8000:8080"

    # Message Broker: routing, breakers, durable event queues and system logs.
    broker:
        logging: *system-logging
        image: ${BROKER_IMAGE:-ion04/messege-broker:4.1.1-dev}
        container_name: cpr-broker
        restart: unless-stopped
        environment:
            DISCOVERY_URL: http://discovery:8080
            TASK_TIMEOUT_SECONDS: 5
            MAX_FAILOVER_ATTEMPTS: 3
            SYSLOG_ENABLED: "1"
            LOG_DOWNLOAD_TOKEN: ${LOG_DOWNLOAD_TOKEN:-}
        ports:
            - "127.0.0.1:8600:8080"
            - "127.0.0.1:50050:50050"
            - "127.0.0.1:${SYSLOG_HOST_PORT:-15514}:5514/udp"
        volumes:
            - broker_data:/app/data

    # ---------------------------------------------------------------------
    # Monitoring
    # ---------------------------------------------------------------------
    # Prometheus scrapes the Broker every 5 seconds; Grafana draws it. Their
    # configuration and the dashboard live in the Broker's repository, so the
    # message-broker submodule has to be checked out.
    prometheus:
        logging: *system-logging
        image: prom/prometheus:v3.5.0
        container_name: cpr-prometheus
        restart: unless-stopped
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=7d
        volumes:
            - ./services/message-broker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        depends_on:
            broker:
                condition: service_healthy
        ports:
            - "127.0.0.1:9090:9090"

    grafana:
        logging: *system-logging
        image: grafana/grafana:12.1.0
        container_name: cpr-grafana
        restart: unless-stopped
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
            # The dashboard can be read without logging in; changing anything
            # needs the admin account.
            GF_AUTH_ANONYMOUS_ENABLED: "true"
            GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/message-broker.json
            GF_ANALYTICS_REPORTING_ENABLED: "false"
            GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
            # Grafana logs every page load at info, which would crowd the other
            # services out of the Broker's bounded log archive.
            GF_LOG_LEVEL: warn
        volumes:
            - ./services/message-broker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./services/message-broker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana_data:/var/lib/grafana
        depends_on:
            - prometheus
        ports:
            - "3000:3000"

    # ---------------------------------------------------------------------
    # Discovery Service
    # ---------------------------------------------------------------------
    # The registry instances join on startup. It keeps no data of its own:
    # the registry lives in memory and the instances rebuild it by registering again.
    discovery:
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: ion04/discovery-service:4.0.0
        container_name: cpr-discovery
        restart: unless-stopped
        environment:
            LOG_LEVEL: INFO
            # Health alerts also go to the developers' Telegram group. Left empty in
            # .env, the alerts are only logged.
            TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
            TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
        ports:
            - "8500:8080"

    # ---------------------------------------------------------------------
    # Base Service
    # ---------------------------------------------------------------------
    base-db:
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: postgres:16
        container_name: cpr-base-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${BASE_POSTGRES_DB}
            POSTGRES_USER: ${BASE_POSTGRES_USER}
            POSTGRES_PASSWORD: ${BASE_POSTGRES_PASSWORD}
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - base_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${BASE_POSTGRES_USER} -d ${BASE_POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5

    base-api:
        logging: *system-logging
        image: ion04/base-service:3.2.0
        restart: unless-stopped
        # Two instances sharing base-db. No container_name and no host port:
        # replicas cannot share either, so Base is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            ConnectionStrings__DefaultConnection: Host=base-db;Port=5432;Database=${BASE_POSTGRES_DB};Username=${BASE_POSTGRES_USER};Password=${BASE_POSTGRES_PASSWORD}
            # Legacy GATEWAY_URL now points to the Broker for internal REST calls.
            # Required: the service refuses to start without it.
            GATEWAY_URL: http://broker:8080
            # Each replica registers here on startup so the Broker can find it.
            DISCOVERY_URL: http://discovery:8080
        depends_on:
            broker:
                condition: service_healthy
            base-db:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # Crafting Service
    # ---------------------------------------------------------------------
    crafting-db:
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: postgres:17
        container_name: cpr-crafting-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${CRAFTING_POSTGRES_DB}
            POSTGRES_USER: ${CRAFTING_POSTGRES_USER}
            POSTGRES_PASSWORD: ${CRAFTING_POSTGRES_PASSWORD}
        ports:
            - "127.0.0.1:5433:5432"
        volumes:
            - crafting_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${CRAFTING_POSTGRES_USER} -d ${CRAFTING_POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    crafting-api:
        logging: *system-logging
        image: ion04/crafting-service:3.2.0
        restart: unless-stopped
        # Two instances sharing crafting-db. No container_name and no host port:
        # replicas cannot share either, so Crafting is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            POSTGRES_DB: ${CRAFTING_POSTGRES_DB}
            POSTGRES_USER: ${CRAFTING_POSTGRES_USER}
            POSTGRES_PASSWORD: ${CRAFTING_POSTGRES_PASSWORD}
            POSTGRES_HOST: crafting-db
            POSTGRES_PORT: 5432
            # Every call to Resource, Player and Exam goes through the Gateway.
            # Required: the service refuses to start without it.
            GATEWAY_URL: http://broker:8080
            # Each replica registers here on startup so the Broker can find it.
            DISCOVERY_URL: http://discovery:8080
        depends_on:
            broker:
                condition: service_healthy
            crafting-db:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # Zombie Service
    # ---------------------------------------------------------------------
    zombie-db:
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: postgres:17
        container_name: cpr-zombie-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${ZOMBIE_POSTGRES_DB}
            POSTGRES_USER: ${ZOMBIE_POSTGRES_USER}
            POSTGRES_PASSWORD: ${ZOMBIE_POSTGRES_PASSWORD}
        ports:
            - "127.0.0.1:5434:5432"
        volumes:
            - zombie_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${ZOMBIE_POSTGRES_USER} -d ${ZOMBIE_POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5

    zombie-api:
        logging: *system-logging
        image: susanito88/zombie-service:3.0.1
        restart: unless-stopped
        # Two instances sharing zombie-db. No container_name and no host port:
        # replicas cannot share either, so Zombie is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            ConnectionStrings__Database: Host=zombie-db;Port=5432;Database=${ZOMBIE_POSTGRES_DB};Username=${ZOMBIE_POSTGRES_USER};Password=${ZOMBIE_POSTGRES_PASSWORD}
            Database__ApplyMigrationsOnStartup: "true"
            # Each replica registers here on startup so the Broker can find it.
            DISCOVERY_URL: http://discovery:8080
        depends_on:
            broker:
                condition: service_healthy
            zombie-db:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # Resource Service
    # ---------------------------------------------------------------------
    resource-db:
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: postgres:17
        container_name: cpr-resource-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${RESOURCE_POSTGRES_DB}
            POSTGRES_USER: ${RESOURCE_POSTGRES_USER}
            POSTGRES_PASSWORD: ${RESOURCE_POSTGRES_PASSWORD}
        ports:
            - "127.0.0.1:5435:5432"
        volumes:
            - resource_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${RESOURCE_POSTGRES_USER} -d ${RESOURCE_POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5

    resource-api:
        logging: *system-logging
        image: susanito88/resource-service:4.0.0
        restart: unless-stopped
        # Two instances sharing resource-db. No container_name and no host port:
        # replicas cannot share either, so Resource is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            ConnectionStrings__Database: Host=resource-db;Port=5432;Database=${RESOURCE_POSTGRES_DB};Username=${RESOURCE_POSTGRES_USER};Password=${RESOURCE_POSTGRES_PASSWORD}
            Database__ApplyMigrationsOnStartup: "true"
            # Each replica registers here on startup so the Broker can find it.
            DISCOVERY_URL: http://discovery:8080
        depends_on:
            broker:
                condition: service_healthy
            resource-db:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # Game Service
    # ---------------------------------------------------------------------
    game-db:
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: rqlite/rqlite:10.3.6
        container_name: cpr-game-db
        restart: unless-stopped
        command:
            - -node-id=game
            - -http-addr=0.0.0.0:4001
            - -http-adv-addr=game-db:4001
            - -raft-addr=0.0.0.0:4002
            - -raft-adv-addr=game-db:4002
        volumes:
            - game-data:/rqlite/file
        ports:
            - "127.0.0.1:4004:4001"   # HTTP API — only needed on the host for local debugging
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4001/readyz"]
            interval: 3s
            timeout: 2s
            retries: 10
            start_period: 5s

    game-service-1:
        logging: *system-logging
        image: adrianburduja/game-service:4.0.1
        restart: unless-stopped
        depends_on:
            broker:
                condition: service_healthy
            game-db:
                condition: service_healthy
        environment:
            - DB_DSN=http://game-db:4001
            - WS_TICKET_SECRET=${WS_TICKET_SECRET}
            - WS_PUBLIC_ADDRESS=http://localhost:8086
            - INSTANCE_ID=game-service-1
            - DISCOVERY_URL=http://discovery:8080
        ports:
            - "8086:8080"
    game-service-2:
        logging: *system-logging
        image: adrianburduja/game-service:3.2.5
        restart: unless-stopped
        depends_on:
            broker:
                condition: service_healthy
            game-db:
                condition: service_healthy
        environment:
            - DB_DSN=http://game-db:4001
            - WS_TICKET_SECRET=${WS_TICKET_SECRET}
            - WS_PUBLIC_ADDRESS=http://localhost:8087
            - INSTANCE_ID=game-service-2
            - DISCOVERY_URL=http://discovery:8080
        ports:
            - "8087:8080"

    # ---------------------------------------------------------------------
    # Player Service
    # ---------------------------------------------------------------------
    player-db:
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: rqlite/rqlite:10.3.6
        container_name: cpr-player-db
        restart: unless-stopped
        command:
            - -node-id=player
            - -http-addr=0.0.0.0:4001
            - -http-adv-addr=player-db:4001
            - -raft-addr=0.0.0.0:4002
            - -raft-adv-addr=player-db:4002
        volumes:
            - player-data:/rqlite/file
        ports:
            - "127.0.0.1:4002:4001"   # HTTP API — only needed on the host for local debugging
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4001/readyz"]
            interval: 3s
            timeout: 2s
            retries: 10
            start_period: 5s

    player-service:
        logging: *system-logging
        image: adrianburduja/player-service:4.0.1
        restart: unless-stopped
        depends_on:
            broker:
                condition: service_healthy
            player-db:
                condition: service_healthy
        deploy:
          replicas: 2
        environment:
            - DISCOVERY_URL=http://discovery:8080
            - DB_DSN=http://player-db:4001

    # ---------------------------------------------------------------------
    # Exam Service
    # ---------------------------------------------------------------------
    exam-db:
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: rqlite/rqlite:10.3.6
        container_name: cpr-exam-rqlite
        restart: unless-stopped
        command:
            - -node-id=exam
            - -http-addr=0.0.0.0:4001
            - -http-adv-addr=exam-db:4001
            - -raft-addr=0.0.0.0:4002
            - -raft-adv-addr=exam-db:4002
        ports:
            - "127.0.0.1:4001:4001"
        volumes:
            - exam_rqlite_data:/rqlite/file
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:4001/readyz"]
            interval: 10s
            timeout: 5s
            retries: 5

    exam-api:
        logging: *system-logging
        image: gheorghe2973/exam-service:4.0.0
        restart: unless-stopped
        # Two instances sharing exam-db. No container_name and no host port:
        # replicas cannot share either, so Exam is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            RQLITE_URL: http://exam-db:4001
            # Both replicas seed at boot; rows that already exist are skipped.
            SEED_ON_START: "true"
            # exam-passed and achievement-unlocked are handed to the Broker over
            # gRPC; it delivers them to whoever subscribed to the topic.
            BROKER_GRPC_ADDR: broker:50050
            DISCOVERY_URL: http://discovery:8080
            REGISTER_INTERVAL_SECONDS: "2"
        depends_on:
            broker:
                condition: service_healthy
            exam-db:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # World Service
    # ---------------------------------------------------------------------
    world-db:
        logging: *system-logging
        depends_on:
            broker:
                condition: service_healthy
        image: rqlite/rqlite:10.3.6
        container_name: cpr-world-rqlite
        restart: unless-stopped
        command:
            - -node-id=world
            - -http-addr=0.0.0.0:4001
            - -http-adv-addr=world-db:4001
            - -raft-addr=0.0.0.0:4002
            - -raft-adv-addr=world-db:4002
        ports:
            - "127.0.0.1:4003:4001"
        volumes:
            - world_rqlite_data:/rqlite/file
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:4001/readyz"]
            interval: 10s
            timeout: 5s
            retries: 5

    world-api:
        logging: *system-logging
        image: gheorghe2973/world-service:4.0.0
        restart: unless-stopped
        # Two instances sharing world-db. No container_name and no host port:
        # replicas cannot share either, so World is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            RQLITE_URL: http://world-db:4001
            # Both replicas seed at boot; rows that already exist are skipped.
            SEED_ON_START: "true"
            # section-unlocked is handed to the Broker over gRPC. exam-passed
            # arrives from it on the gRPC port 50051, which every replica names
            # as a topic in its Discovery registration.
            BROKER_GRPC_ADDR: broker:50050
            DISCOVERY_URL: http://discovery:8080
            REGISTER_INTERVAL_SECONDS: "2"
        depends_on:
            broker:
                condition: service_healthy
            world-db:
                condition: service_healthy

volumes:
    broker_data:
    base_pgdata:
    crafting_pgdata:
    zombie_pgdata:
    resource_pgdata:
    game-data:
    player-data:
    exam_rqlite_data:
    world_rqlite_data:
    prometheus_data:
    grafana_data:
