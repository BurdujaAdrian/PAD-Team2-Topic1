# Common deployment for PAD Team 2's services.
# teammate's service is pulled as a prebuilt image from DockerHub.

services:
    # ---------------------------------------------------------------------
    # Gateway
    # ---------------------------------------------------------------------
    gateway:
        image: gheorghe2973/gateway-service:3.1.0-dev
        container_name: cpr-gateway
        restart: unless-stopped
        environment:
            EXAM_SERVICE_URL: http://exam-api:8080
            WORLD_SERVICE_URL: http://world-api:8080
            PLAYER_SERVICE_URL: http://player-service:8080
            GAME_SERVICE_URL: http://game-service:8080
            BASE_SERVICE_URL: http://base-api:8080
            CRAFTING_SERVICE_URL: http://crafting-api:8080
            ZOMBIE_SERVICE_URL: http://zombie-api:8080
            RESOURCE_SERVICE_URL: http://resource-api:8080
            WS_TICKET_SECRET: ${WS_TICKET_SECRET}
            # Services that register here (Base, Crafting) are reached through their
            # instances in turn (Round-Robin); the URLs above are the fallback.
            DISCOVERY_URL: http://discovery:8080
        ports:
            - "8000:8080"

    # ---------------------------------------------------------------------
    # Discovery Service
    # ---------------------------------------------------------------------
    # The registry instances join on startup. It keeps no data of its own:
    # the registry lives in memory and the instances rebuild it by registering again.
    discovery:
        image: ion04/discovery-service:3.1.0
        container_name: cpr-discovery
        restart: unless-stopped
        environment:
            LOG_LEVEL: INFO
            # Health alerts also go to the developers' Telegram group. Left empty in
            # .env, the alerts are only logged.
            TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
            TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
        ports:
            - "8500:8080"

    # ---------------------------------------------------------------------
    # Base Service
    # ---------------------------------------------------------------------
    base-db:
        image: postgres:16
        container_name: cpr-base-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${BASE_POSTGRES_DB}
            POSTGRES_USER: ${BASE_POSTGRES_USER}
            POSTGRES_PASSWORD: ${BASE_POSTGRES_PASSWORD}
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - base_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${BASE_POSTGRES_USER} -d ${BASE_POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5

    base-api:
        image: ion04/base-service:3.2.0
        restart: unless-stopped
        # Two instances sharing base-db. No container_name and no host port:
        # replicas cannot share either, so Base is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            ASPNETCORE_ENVIRONMENT: Production
            ConnectionStrings__DefaultConnection: Host=base-db;Port=5432;Database=${BASE_POSTGRES_DB};Username=${BASE_POSTGRES_USER};Password=${BASE_POSTGRES_PASSWORD}
            # Every call to World, Resource and Player goes through the Gateway.
            # Required: the service refuses to start without it.
            GATEWAY_URL: http://gateway:8080
            # Each replica registers here on startup so the Gateway can find it.
            DISCOVERY_URL: http://discovery:8080
        depends_on:
            base-db:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # Crafting Service
    # ---------------------------------------------------------------------
    crafting-db:
        image: postgres:17
        container_name: cpr-crafting-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${CRAFTING_POSTGRES_DB}
            POSTGRES_USER: ${CRAFTING_POSTGRES_USER}
            POSTGRES_PASSWORD: ${CRAFTING_POSTGRES_PASSWORD}
        ports:
            - "127.0.0.1:5433:5432"
        volumes:
            - crafting_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${CRAFTING_POSTGRES_USER} -d ${CRAFTING_POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10

    crafting-api:
        image: ion04/crafting-service:3.2.0
        restart: unless-stopped
        # Two instances sharing crafting-db. No container_name and no host port:
        # replicas cannot share either, so Crafting is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            POSTGRES_DB: ${CRAFTING_POSTGRES_DB}
            POSTGRES_USER: ${CRAFTING_POSTGRES_USER}
            POSTGRES_PASSWORD: ${CRAFTING_POSTGRES_PASSWORD}
            POSTGRES_HOST: crafting-db
            POSTGRES_PORT: 5432
            # Every call to Resource, Player and Exam goes through the Gateway.
            # Required: the service refuses to start without it.
            GATEWAY_URL: http://gateway:8080
            # Each replica registers here on startup so the Gateway can find it.
            DISCOVERY_URL: http://discovery:8080
        depends_on:
            crafting-db:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # Zombie Service
    # ---------------------------------------------------------------------
    zombie-db:
        image: postgres:17
        container_name: cpr-zombie-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${ZOMBIE_POSTGRES_DB}
            POSTGRES_USER: ${ZOMBIE_POSTGRES_USER}
            POSTGRES_PASSWORD: ${ZOMBIE_POSTGRES_PASSWORD}
        ports:
            - "127.0.0.1:5434:5432"
        volumes:
            - zombie_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${ZOMBIE_POSTGRES_USER} -d ${ZOMBIE_POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5

    zombie-api:
        image: susanito88/zombie-service:3.0.1
        restart: unless-stopped
        # Two instances sharing zombie-db. No container_name and no host port:
        # replicas cannot share either, so Zombie is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            ConnectionStrings__Database: Host=zombie-db;Port=5432;Database=${ZOMBIE_POSTGRES_DB};Username=${ZOMBIE_POSTGRES_USER};Password=${ZOMBIE_POSTGRES_PASSWORD}
            Database__ApplyMigrationsOnStartup: "true"
            # Each replica registers here on startup so the Gateway can find it.
            DISCOVERY_URL: http://discovery:8080
        depends_on:
            zombie-db:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # Resource Service
    # ---------------------------------------------------------------------
    resource-db:
        image: postgres:17
        container_name: cpr-resource-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${RESOURCE_POSTGRES_DB}
            POSTGRES_USER: ${RESOURCE_POSTGRES_USER}
            POSTGRES_PASSWORD: ${RESOURCE_POSTGRES_PASSWORD}
        ports:
            - "127.0.0.1:5435:5432"
        volumes:
            - resource_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${RESOURCE_POSTGRES_USER} -d ${RESOURCE_POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5

    resource-api:
        image: susanito88/resource-service:3.0.1
        restart: unless-stopped
        # Two instances sharing resource-db. No container_name and no host port:
        # replicas cannot share either, so Resource is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            ConnectionStrings__Database: Host=resource-db;Port=5432;Database=${RESOURCE_POSTGRES_DB};Username=${RESOURCE_POSTGRES_USER};Password=${RESOURCE_POSTGRES_PASSWORD}
            Database__ApplyMigrationsOnStartup: "true"
            # Each replica registers here on startup so the Gateway can find it.
            DISCOVERY_URL: http://discovery:8080
        depends_on:
            resource-db:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # Game Service
    # ---------------------------------------------------------------------
    game-db:
        image: rqlite/rqlite:10.3.6
        container_name: cpr-game-db
        restart: unless-stopped
        command:
            - -node-id=game
            - -http-addr=0.0.0.0:4001
            - -http-adv-addr=game-db:4001
            - -raft-addr=0.0.0.0:4002
            - -raft-adv-addr=game-db:4002
        volumes:
            - game-data:/rqlite/file
        ports:
            - "127.0.0.1:4004:4001"   # HTTP API — only needed on the host for local debugging
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4001/readyz"]
            interval: 3s
            timeout: 2s
            retries: 10
            start_period: 5s

    game-service:
        image: adrianburduja/game-service:0.0.2
        container_name: cpr-game-service
        restart: unless-stopped
        depends_on:
            game-db:
                condition: service_healthy
        environment:
            - DB_DSN=http://game-db:4001
            - WS_TICKET_SECRET=${WS_TICKET_SECRET}
        ports:
            - "8086:8080"

    # ---------------------------------------------------------------------
    # Player Service
    # ---------------------------------------------------------------------
    player-db:
        image: rqlite/rqlite:10.3.6
        container_name: cpr-player-db
        restart: unless-stopped
        command:
            - -node-id=player
            - -http-addr=0.0.0.0:4001
            - -http-adv-addr=player-db:4001
            - -raft-addr=0.0.0.0:4002
            - -raft-adv-addr=player-db:4002
        volumes:
            - player-data:/rqlite/file
        ports:
            - "127.0.0.1:4002:4001"   # HTTP API — only needed on the host for local debugging
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4001/readyz"]
            interval: 3s
            timeout: 2s
            retries: 10
            start_period: 5s

    player-service:
        # 0.0.2 is not published on Docker Hub; 0.0.1 is the latest version tag.
        image: adrianburduja/player-service:0.0.1
        container_name: cpr-player-service
        restart: unless-stopped
        depends_on:
            player-db:
                condition: service_healthy
        environment:
            - DB_DSN=http://player-db:4001
        ports:
            - "8085:8080"

    # ---------------------------------------------------------------------
    # Exam Service
    # ---------------------------------------------------------------------
    exam-db:
        image: rqlite/rqlite:10.3.6
        container_name: cpr-exam-rqlite
        restart: unless-stopped
        command:
            - -node-id=exam
            - -http-addr=0.0.0.0:4001
            - -http-adv-addr=exam-db:4001
            - -raft-addr=0.0.0.0:4002
            - -raft-adv-addr=exam-db:4002
        ports:
            - "127.0.0.1:4001:4001"
        volumes:
            - exam_rqlite_data:/rqlite/file
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:4001/readyz"]
            interval: 10s
            timeout: 5s
            retries: 5

    exam-api:
        image: gheorghe2973/exam-service:3.1.0
        restart: unless-stopped
        # Two instances sharing exam-db. No container_name and no host port:
        # replicas cannot share either, so Exam is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            RQLITE_URL: http://exam-db:4001
            # Both replicas seed at boot; rows that already exist are skipped.
            SEED_ON_START: "true"
            # Through the Gateway like every other service-to-service call, so
            # the event is balanced across the World replicas.
            EXAM_PASSED_SUBSCRIBERS: http://gateway:8080/api/events/exam-passed
            DISCOVERY_URL: http://discovery:8080
            REGISTER_INTERVAL_SECONDS: "2"
        depends_on:
            exam-db:
                condition: service_healthy

    # ---------------------------------------------------------------------
    # World Service
    # ---------------------------------------------------------------------
    world-db:
        image: rqlite/rqlite:10.3.6
        container_name: cpr-world-rqlite
        restart: unless-stopped
        command:
            - -node-id=world
            - -http-addr=0.0.0.0:4001
            - -http-adv-addr=world-db:4001
            - -raft-addr=0.0.0.0:4002
            - -raft-adv-addr=world-db:4002
        ports:
            - "127.0.0.1:4003:4001"
        volumes:
            - world_rqlite_data:/rqlite/file
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:4001/readyz"]
            interval: 10s
            timeout: 5s
            retries: 5

    world-api:
        image: gheorghe2973/world-service:3.1.0
        restart: unless-stopped
        # Two instances sharing world-db. No container_name and no host port:
        # replicas cannot share either, so World is reached through the Gateway.
        deploy:
            replicas: 2
        environment:
            RQLITE_URL: http://world-db:4001
            # Both replicas seed at boot; rows that already exist are skipped.
            SEED_ON_START: "true"
            SECTION_UNLOCKED_SUBSCRIBERS: ""
            DISCOVERY_URL: http://discovery:8080
            REGISTER_INTERVAL_SECONDS: "2"
        depends_on:
            world-db:
                condition: service_healthy

volumes:
    base_pgdata:
    crafting_pgdata:
    zombie_pgdata:
    resource_pgdata:
    game-data:
    player-data:
    exam_rqlite_data:
    world_rqlite_data:
